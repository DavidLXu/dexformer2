[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dexformer-video-studio"
version = "0.1.0"
description = "Native robot rendering recipes and recorded-trajectory playback for DexFormer 2.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<2", "scipy>=1.13", "Pillow>=10", "imageio-ffmpeg>=0.6"]
[project.optional-dependencies]
render = ["bpy==4.5.3"]
dev = ["pytest>=8"]
[project.scripts]
dexvideo = "dexvideo.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
